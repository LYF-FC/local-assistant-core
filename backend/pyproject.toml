[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "butler-backend"
version = "0.1.0"
description = "Butler private family operating system API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "argon2-cffi>=25.1,<26",
  "tzdata>=2026.6,<2027",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "ruff>=0.9,<1",
  "pytest-cov>=6,<8",
  "pytest-socket>=0.7,<1",
  "pip-audit>=2.9,<3",
  "pyyaml>=6,<7",
  "build>=1.2,<2",
  "bandit>=1.8,<2",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --disable-socket"
markers = ["integration: requires a disposable PostgreSQL database"]

